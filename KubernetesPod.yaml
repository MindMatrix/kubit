apiVersion: v1
kind: Pod
metadata:
  name: jb
spec:
  containers:
    - name: dotnet-sdk
      image: mcr.microsoft.com/dotnet/sdk:10.0
      command:
        - sleep
      args:
        - 99d
      tty: true
      resources:
        limits:
          cpu: 8000m
          memory: 12Gi
        requests:
          cpu: 1000m
          memory: 512Mi
      volumeMounts:
        - mountPath: /mnt/data/packages
          name: dotnet-build-packages
        - name: ssh-keys-volume
          mountPath: "/tmp/ssh"
          readOnly: true
      env:
        - name: NUGET_PACKAGES
          value: "/mnt/data/packages"
  volumes:
    - name: dotnet-build-packages
      persistentVolumeClaim:
        claimName: dotnet-build-packages
    - name: ssh-keys-volume
      secret:
        secretName: git-client-keys
